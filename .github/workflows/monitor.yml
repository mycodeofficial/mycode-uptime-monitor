name: Vigilante externo MyCode
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vigilante-externo
  cancel-in-progress: false
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Comprobar webs desde fuera del servidor
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGETS_JSON: ${{ secrets.TELEGRAM_TARGETS_JSON }}
        run: python3 monitor.py
